<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff7f9" />

  <title>Hi Bae.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: "DM Sans", system-ui, sans-serif;
      color: #251d20;
      background: #fff7f9;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 205, 219, 0.55),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(239, 215, 255, 0.5),
          transparent 30%
        ),
        #fff7f9;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92vw, 520px);
      min-height: 620px;
      padding: 34px 30px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      border: 1px solid rgba(60, 35, 43, 0.08);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 25px 80px rgba(74, 37, 49, 0.12);
      backdrop-filter: blur(18px);
      animation: appear 0.8s ease both;
    }

    .eyebrow,
    .footer {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9a7e87;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-15px);
    }

    h1 {
      margin: 0 0 18px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(42px, 10vw, 66px);
      font-weight: 600;
      line-height: 1;
    }

    .message {
      max-width: 360px;
      margin: 0 auto 30px;
      font-size: 17px;
      line-height: 1.65;
      color: #6e5961;
    }

    #name {
      color: #2c2024;
      font-weight: 600;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 27px;
      font: inherit;
      font-weight: 600;
      color: white;
      background: #2d2226;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(45, 34, 38, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(45, 34, 38, 0.23);
    }

    button:active {
      transform: translateY(0);
    }

    .reveal {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.65s ease, opacity 0.45s ease, margin-top 0.45s ease;
    }

    .reveal.show {
      max-height: 180px;
      opacity: 1;
      margin-top: 28px;
    }

    .heart {
      margin: 0 0 8px;
      font-size: 34px;
      animation: pulse 1.3s ease infinite;
    }

    .secret {
      margin: 0;
      max-width: 330px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 20px;
      line-height: 1.45;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.12);
      }
    }

    @media (max-width: 520px) {
      .card {
        min-height: 560px;
        padding: 26px 22px 22px;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <div class="eyebrow">
        One message
      </div>

      <div class="content">
        <h1>Hi Baby,</h1>

        <p class="message">
          <span id="name">Devaliant</span> wants to tell you something.
        </p>

        <button id="whatBtn" type="button">
          What?
        </button>

        <div class="reveal" id="reveal" aria-hidden="true">
          <p class="heart">♥</p>
          <p class="secret">
            You mean more to me than words can explain.
          </p>
        </div>
      </div>

      <div class="footer">
        Made for one person
      </div>

    </section>
  </main>

  <script>
    const button = document.getElementById("whatBtn");
    const reveal = document.getElementById("reveal");

    button.addEventListener("click", () => {
      const open = reveal.classList.toggle("show");
      reveal.setAttribute("aria-hidden", String(!open));
      button.textContent = open ? "Aww ♥" : "What?";
    });
  </script>

</body>
</html>
